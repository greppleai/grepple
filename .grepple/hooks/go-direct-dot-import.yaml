# Run with `grepple hook` (changed files) or `grepple hook --all` (all sources).
# This matches direct imports only; grouped imports need a separate query capability.
version: 1
id: go-direct-dot-import
engine: gritql-v1
include:
  - "**/*.go"
severity: warning
message: "Use a named import rather than a direct dot import."
query: |
  language go
  `import . $path`