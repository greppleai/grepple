  cmd:
    description: Entry point for the Grepple command-line application that executes CLI requests and translates failures into process behavior.
    responsibilities:
    - Ignore broken-pipe signals.
    - Run the CLI with command-line arguments.
    - Apply recognized error exit codes.
    - Suppress broken-pipe errors.
    - Report unexpected errors and exit unsuccessfully.
    files: []
  cmd/grepple:
    description: Entry point for the Grepple command-line application that handles signals, CLI execution, and process exit behavior.
    responsibilities:
    - Ignore broken-pipe signals.
    - Invoke the CLI with process arguments.
    - Map recognized errors to exit codes.
    - Handle broken-pipe errors gracefully.
    - Report unknown errors and exit with failure.
    files:
