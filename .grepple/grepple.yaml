version: 1
directories:
  .agents:
    description: The .agents directory provides Grepple-oriented workflows for source discovery, architecture analysis, impact assessment, delegated research, search, and structural audits.
    responsibilities:
    - Guide architecture and boundary analysis
    - Support source-backed diagram workflows
    - Locate declarations and directory ownership
    - Assess change impact and navigation
    - Coordinate delegated read-only research
    - Provide local and remote search guidance
    - Audit syntax-shaped source patterns
    files: []
  .agents/skills/architecture-boundary-review:
    description: Provides a source-backed workflow for evaluating architecture boundaries, ownership, coupling, dependency leakage, and facade integrity.
    responsibilities:
    - Establish source and ownership context
    - Analyze boundary and dependency signals
    - Inspect focused callers and callees
    - Verify public signatures and package direction
    - Distinguish heuristic leads from confirmed findings
    - Produce source-backed architectural recommendations
    files:
    - path: SKILL.md
      description: Defines the Grepple workflow and interpretation rules for reviewing architecture boundaries and dependency evidence.
      kind: production
      checksum: 6d1698ab8cf093e2f4669a16173600512df0118a4e37d992e61e87e892041c1d
  .agents/skills/architecture-diagram-workflow:
    description: Defines a source-backed workflow for creating, inspecting, and validating focused Mermaid architecture diagrams with Grepple.
    responsibilities:
    - Select diagram projections based on architectural questions
    - Generate focused structure and flow diagrams from source locations
    - Validate diagrams used for decisions or documentation
    - Apply source metadata and relationship trust rules
    - Direct users to discovery and change-impact workflows
    files:
    - path: SKILL.md
      description: Provides commands, projection guidance, workflow steps, and trust rules for source-backed Mermaid architecture diagrams.
      kind: production
      checksum: 206b1fc60d82589ce45178ddb6cc401b54f974b44de3a2f1479e3fe5b5b4c8fb
  .agents/skills/architecture-lookup-discovery:
    description: Provides a Grepple workflow for locating source ownership, declarations, entrypoints, and cross-directory relationships while preserving evidence and uncertainty.
    responsibilities:
    - Map bounded repository architecture
    - Resolve symbols to declarations
    - Explain call, import, and type relationships
    - Verify emitted source ranges
    - Assess source coverage and truncation
    - Compare architecture reports for drift
    - Preserve evidence and uncertainty
    files:
    - path: SKILL.md
      description: Defines evidence-based commands and trust rules for repository architecture discovery with Grepple.
      kind: production
      checksum: 287a17f073e7f0c0e2165d17b27c383979218718c03c9ffe5b765d7f5ee51183
  .agents/skills/change-impact-analysis:
    description: Defines a Grepple workflow for resolving symbols and assessing scoped code-change impact.
    responsibilities:
    - Resolve exact symbol declarations
    - Preview related behavior and consumers
    - Trace callers, callees, and impact
    - Assess graph completeness and confidence
    - Check non-static impact mechanisms
    - Record scoped impact evidence
    files:
    - path: SKILL.md
      description: Documents Grepple commands, confidence rules, completeness checks, and decision records for code-change impact analysis.
      kind: production
      checksum: b949a1f4c936c356165db4d238c5d0af2c7daca0f5f6509702e614b676d87ddb
  .agents/skills:
    description: This directory provides source-backed Grepple workflows for repository discovery, architecture analysis, change impact, research delegation, searching, and structural audits.
    responsibilities:
    - Orient unfamiliar repositories
    - Analyze architecture and boundaries
    - Assess change impact
    - Delegate read-only research
    - Retrieve local and remote source evidence
    - Audit syntax-shaped patterns
    files: []
  .agents/skills/local-grep-and-search:
    description: Provides deterministic guidance for local file discovery, text and declaration search, evidence retrieval, and edit-safe writes with Grepple.
    responsibilities:
    - Select appropriate local search intents
    - Define evidence completeness and scope rules
    - Retrieve exact implementation ranges and edit anchors
    - Apply safe transactional write workflows
    - Route impact, architecture, and structural questions to specialized skills
    files:
    - path: SKILL.md
