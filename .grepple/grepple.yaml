      kind: production
      checksum: 5caf39f876b3a292e795c2ae66c0a28c2b964b2b2d916c3bbde127c4beb30410
  .agents/skills/remote-grep-and-search:
    description: Guidance for using Grepple to search and navigate indexed remote repositories without cloning them.
    responsibilities:
    - Select the appropriate remote inspection command
    - Require exact repository scoping for searches
    - Navigate remote files, trees, and related symbols
    - Apply pagination and truncation safeguards
    files:
