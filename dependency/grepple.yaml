description: Dependency resolution provides a common registry for Go, npm, Cargo, and Maven manifests, lockfiles, import matching, and artifact discovery.
responsibilities:
    - Resolve manager-specific manifests and lockfiles
    - Match source imports to dependency evidence
    - Discover publishable artifact modules
    - Validate registry and integrity metadata
    - Select applicable projects through resolver registries
    - Test resolver registration and project selection
files:
    - path: cargo.go
      description: Resolves Cargo manifests and lockfiles, matches Rust imports, and discovers Cargo artifact modules.
      kind: production
      checksum: c0a18be7a8abffc803cce09a23b563889d5beba759dfbf78059899fac91ef31e
      areas:
        - cargo-resolution
    - path: gomod.go
