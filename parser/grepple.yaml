description: The parser package converts source and Markdown content into syntax-aware documents, outlines, segments, and navigation facts across multiple languages.
responsibilities:
    - Parse Tree-sitter-backed source documents
    - Support language-specific syntax and navigation
    - Build outlines and structural segments
    - Extract declarations, calls, imports, and references
    - Manage document views and source ranges
    - Serialize and cache navigation graphs
    - Validate parsing and navigation behavior
