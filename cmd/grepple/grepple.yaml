description: Entry point for the Grepple command-line application that handles signals, CLI execution, and process exit behavior.
responsibilities:
    - Ignore broken-pipe signals.
    - Invoke the CLI with process arguments.
    - Map recognized errors to exit codes.
    - Handle broken-pipe errors gracefully.
    - Report unknown errors and exit with failure.
