description: The hooks module builds, tests, lints, and runs project-local Pi hooks for grep protection, lint feedback, and Mermaid validation.
responsibilities:
    - Build the Pi hook executable
    - Run Go tests and lint checks
    - Dispatch grep-guard and lint-check commands
    - Validate Mermaid schemas during Stop hooks
    - Manage Go module dependencies
    - Document hook architecture and development workflows
