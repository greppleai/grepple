description: A Go command-line entry point that reads pi hook input and dispatches grep-guard or lint-check processing.
responsibilities:
    - Validate the hook command argument
    - Read hook input from standard input
    - Dispatch grep-guard processing
    - Dispatch lint-check processing with the working directory
    - Write hook output to standard output
    - Report invalid invocation errors
