description: Pi hook internals block legacy search commands, run Stop-hook linting, format diagnostics, validate Mermaid schemas, and detect cross-file struct methods.
responsibilities:
    - Block legacy search invocations
    - Run Go and Mermaid Stop-hook checks
    - Format bounded diagnostic feedback
    - Validate source-backed Mermaid schemas
    - Detect methods separated from struct declarations
    - Test hook protocols and analyzers
