description: The search package discovers and filters source files, matches queries, resolves exact references, analyzes structure, builds navigation context, and produces ranked results.
responsibilities:
    - Resolve and validate search requests
    - Discover and filter candidate files
    - Match literal and regular-expression queries
    - Support exact references and line ranges
    - Extract structural and contextual match data
    - Build and query navigation graphs
    - Attach related declarations and dependency context
    - Analyze architectural and type boundaries
    - Rank, page, and serialize search results
    - Coordinate bounded concurrent processing
