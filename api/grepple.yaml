description: The api package defines wire-compatible contracts for search, structural analysis, repository navigation, indexing, language capabilities, rules, and bounded result metadata.
responsibilities:
    - Define versioned analysis requests and responses.
    - Model bounded graph traversal and repository analysis.
    - Specify structural search bindings, findings, diagnostics, limits, and truncation.
    - Preserve wire-compatible search and navigation contracts.
    - Represent repository listings, trees, index targets, and rule results.
    - Validate repository identifiers and reference patterns.
    - Publish language feature and navigation-fact capabilities.
    - Standardize result scope, pagination, limits, omissions, and diagnostics.
