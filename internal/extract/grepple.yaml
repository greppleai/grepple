description: The extract package analyzes supported source languages into shared semantic models, resolves navigation and metadata, and parses or generates validated Mermaid class and flow diagrams.
responsibilities:
    - Register language analyzers and dispatch source parsing
    - Discover and load supported source files
    - Extract declarations, members, imports, exports, and symbols
    - Build package, module, scope, and navigation indexes
    - Resolve cross-file and cross-language relationships
    - Parse and validate Mermaid class diagrams and flowcharts
    - Generate focused structure and call-flow diagrams
    - Enforce metadata, cardinality, completeness, and diagram parity
