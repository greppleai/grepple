description: The sources package discovers repository files, applies ignore and production policies, classifies files using checksum-validated metadata, and explains source-selection decisions.
responsibilities:
    - Discover files from globs and directory scopes deterministically
    - Apply gitignore, configured, and built-in subtree exclusions
    - Classify sources from validated directory metadata
    - Enforce production-only selection and explicit-file bypasses
    - Inspect and report source-selection decisions and counts
    - Expose source-policy compatibility helpers
files:
    - path: catalog.go
      description: This file defines discovery options and public candidate, listing, and policy-aware file operations.
      kind: production
      checksum: 6045bae60d49a9c2f2a55c9b72f6b6cf421f2461c63a59f1829d4ba98ee2a687
    - path: compatibility.go
      description: This file exposes compatibility wrappers for ignore checks, root checks, glob splitting, and path matching.
      kind: production
      checksum: da6d67219ed6faefc1e0300d3127fba0e79e9abea5f7a8ea211fa26a6af42490
    - path: discovery.go
      description: This file implements deterministic glob expansion, recursive walking, root confinement, gitignore handling, and candidate collection.
      kind: production
      checksum: 94fe614cb5734445a90c4d1623ea2860f5b107465612e0fbc2fb733033cf11b5
    - path: ignore.go
      description: This file applies configured path filters, built-in subtree exclusions, and production-only classification filtering.
      kind: production
      checksum: caee930de4789dbbd604e5a7c5786d6ea2a75e22c6a8b9d3e2e7ef7989fb6bbb
    - path: inspection.go
      description: This file builds source-scope reports containing configuration details, counts, classifications, exclusions, and decisions.
      kind: production
      checksum: b90e40dc755aa18cc528ac7a96be78eb90880426116c06caf306acc872d99c66
    - path: kind.go
      description: This file defines supported source kinds and performs checksum-validated metadata classification.
      kind: production
      checksum: 4ee47d48b9051a53268456bcc161af8bd624da45a4934d155cc9143c79f7de64
    - path: kind_test.go
      description: This file tests metadata classification, kind parsing, stale checksums, missing classifications, and production-only traversal.
      kind: test
      checksum: a2a4afdcf3b77970d429a17c6404d9c856d1e2f69c7d596be089da1531ba930e
    - path: policy.go
      description: This file defines repository source policy options and reports explicitly named files that bypass policy filters.
      kind: production
      checksum: 4b4c330126d17c2d67abdd6ec10e4c0e25691abd25e7256c968d84631540f69a
    - path: scope.go
      description: This file inspects input paths and records deterministic decisions for selected, ignored, excluded, and explicitly bypassed sources.
      kind: production
      checksum: 9597e620f0d28627337558d71a424f40b4b35a3b896d0094b87f00e25ddcc0e1
    - path: scope_test.go
      description: This file tests inspection decisions for gitignore rules, configured ignores, production filtering, explicit bypasses, and built-in subtrees.
      kind: test
      checksum: e4dd6656dbfa5866c024cdb2a5164d4b3b33b2b3d9e0d541d0f50189957f8ba7
