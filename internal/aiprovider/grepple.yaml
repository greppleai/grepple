description: Provides built-in AI provider authentication, credential persistence, model construction, and provider/model selection for Grepple.
responsibilities:
    - Register built-in AI providers
    - Authenticate API-key, OAuth, device-login, and AWS providers
    - Construct Fantasy language models
    - Resolve provider and model selections
    - Persist credentials securely and atomically
    - Validate provider integrations
files:
    - path: api_key.go
      description: Implements Anthropic and OpenAI providers using API keys, environment credentials, and Anthropic subscription OAuth tokens.
      kind: production
      checksum: 93ac46a9d82a4fc8e1986d47151d7e02fc75604e8e115c2205e311f073c73f2b
    - path: bedrock.go
      description: Validates AWS credentials and constructs Fantasy models backed by Amazon Bedrock.
      kind: production
      checksum: 33e608db8a8166b7430618bb1023ca07da036f0e49556442ef5cfaa8ebc58ad3
    - path: codex.go
      description: Implements OpenAI Codex device authorization, token exchange, refresh, JWT handling, and model access.
      kind: production
      checksum: 4e868141ca5a0c98cdc0247f7a3b94a7b1a3c59bcf64b6d8deeff4fed29712c1
    - path: codex_test.go
      description: Tests Codex device login, token refresh, OAuth headers, model requests, and provider registry behavior.
      kind: test
      checksum: ae45d62acf3eee0545c8d528110b3e77851a591aa0f80218a77ea6e14b7646b8
    - path: copilot.go
      description: Implements GitHub Copilot device authorization, token exchange, credential storage, and Fantasy model construction.
      kind: production
      checksum: 5f0679785942e9e9f5cda4e7bb6f71f340266b4853d6244b2097d55a63304d65
    - path: provider.go
      description: Defines provider authentication and model interfaces plus a deterministic registry of built-in services.
      kind: production
      checksum: 581ac40a74e86512a776e3bdfa3f328e5580c3a03eeac9e5976da816782517c4
    - path: providers_test.go
      description: Tests API-key, Anthropic subscription, Copilot, and Bedrock authentication and model construction.
      kind: test
      checksum: 490d60f0df6a61f526f781fb1b760e6524d541c9bf0e9e731b9cb6b32774784f
    - path: selection.go
      description: Resolves explicit and configured provider and model selectors according to precedence and conflict rules.
      kind: production
      checksum: 9e118f9196e0c016a659cf39b18166cbc905c67b231cab5dfb73f210709624c7
    - path: store.go
      description: Provides locked, atomic, private persistence for provider-specific AI credentials.
      kind: production
      checksum: aa1476158d6f7090a213878c0d60c0186fdddeb8e121e6af8e29ebb69abb7388
    - path: store_test.go
