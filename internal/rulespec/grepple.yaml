description: The rulespec package defines, normalizes, validates, and serializes legacy text and structural search rules.
responsibilities:
    - Define rule models, engines, modes, and resource limits
    - Normalize text and structural search requests
    - Validate queries, scopes, compatibility, metadata, and limits
    - Compile structural queries and preserve legacy text wire compatibility
    - Test normalization, validation, copying, and serialization behavior
