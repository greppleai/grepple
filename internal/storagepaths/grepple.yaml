description: Resolves configured or fallback locations for output artifacts and repository-specific caches.
responsibilities:
    - Resolve configured or platform-default output artifact directories
    - Derive repository-specific cache keys
    - Create cache directories with restricted permissions
    - Fall back to temporary storage when user cache directories are unavailable
