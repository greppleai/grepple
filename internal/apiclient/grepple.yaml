description: The apiclient package provides typed HTTP operations for Grepple APIs and GitHub device-flow authentication.
responsibilities:
    - Expose typed search, navigation, analysis, repository, tree, rule, and raw-content operations
    - Construct and execute authenticated HTTP requests
    - Enforce response size and schema validation
    - Refresh and persist expiring authentication tokens
    - Support GitHub device-code login and identity lookup
