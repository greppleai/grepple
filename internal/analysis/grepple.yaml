description: Provides deterministic source-universe analysis through reusable navigation graphs, directory architecture and responsibility reports, boundary analysis, relationship evidence, projections, and normalized architecture comparison.
responsibilities:
    - Load and account for selected sources
    - Parse supported sources into reusable documents
    - Build validated navigation graph reports
    - Project directory architecture and symbol ownership
    - Resolve imports, calls, and type relationships
    - Analyze boundaries, facades, and directory responsibilities
    - Provide deterministic symbol and relation evidence projections
    - Normalize and compare architecture reports
    - Preserve completeness, failure, and truncation metadata
