description: The render package formats search, navigation, outline, and tree results while tracking reusable source coverage and bounded output.
responsibilities:
    - Dispatch search results to text, JSON, file, and count renderers
    - Render structural segments, matches, context lines, and editable anchors
    - Deduplicate covered source and persist context statistics
    - Render navigation points and related type definitions
    - Discover files and format filtered structural outlines
    - Render repository trees with descriptions and metadata statuses
    - Enforce output limits and report range warnings
    - Validate rendering, coverage, navigation, outline, and tree behavior
