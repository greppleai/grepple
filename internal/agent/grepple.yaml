      description: Defines agent requests, results, event sinks, and streamed execution with lifecycle and timing events.
      kind: production
      checksum: 3eb2972db7ccc24d68b31d5f6895325a217fd78b9cbeeee0b5c210760da96799
    - path: log.go
      description: Implements concurrency-safe JSONL session logging with retention, disabled mode, and private filesystem permissions.
      kind: production
