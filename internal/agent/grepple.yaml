description: The agent package runs language-model agents while recording session events, persistent logs, and performance telemetry.
responsibilities:
    - Execute streamed language-model agents
    - Record agent lifecycle events
    - Persist concurrency-safe JSONL session logs
    - Enforce log retention and filesystem permissions
    - Measure LLM and tool performance
    - Aggregate cache-aware session metrics
    - Test logging and telemetry behavior
