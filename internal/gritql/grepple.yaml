description: The gritql package implements immutable structural search with query compilation, language adapters, matching, evaluation, diagnostics, and bounded concurrent scanning.
responsibilities:
    - Compile and validate GritQL programs
    - Parse pinned structural query syntax
    - Adapt multiple Tree-sitter target languages
    - Build immutable structural templates
    - Match syntax trees and bind metavariables
    - Evaluate programs within deterministic resource limits
    - Normalize findings and diagnostics
    - Scan bounded filesystem candidates concurrently
    - Share parsing across multi-program scans
    - Validate conformance and performance behavior
