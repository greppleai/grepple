description: The authstate package manages per-user authentication state stored in a protected JSON configuration file.
responsibilities:
    - Resolve the per-user configuration path
    - Load and persist authentication state
    - Store access and refresh token expiry timestamps
    - Apply environment token overrides
    - Clear credentials while preserving server settings
