description: Runs the authenticated local CLI daemon and caches bounded architecture, graph, and symbol-resolution reports.
responsibilities:
    - Serve authenticated local report requests
    - Validate repository boundaries and source snapshots
    - Fingerprint source and project context
    - Cache bounded report variants with LRU eviction
    - Publish and validate secure daemon descriptors
    - Query and update compatible local workers
    - Support focused graph and symbol-resolution reports
    - Fall back safely on cache or worker misses
