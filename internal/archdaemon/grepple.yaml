description: Provides an authenticated local daemon that validates source snapshots and caches architecture, graph, and symbol-resolution reports.
responsibilities:
    - Serve authenticated local report requests
    - Validate repository boundaries and source snapshots
    - Fingerprint source and project context
    - Cache bounded report variants with LRU eviction
    - Publish and validate secure daemon descriptors
    - Query and update compatible local workers
    - Support focused graph and symbol-resolution reports
    - Fall back safely on cache or worker misses
files:
    - path: cache.go
      description: Implements bounded per-root LRU storage for architecture, graph, and symbol-resolution report variants.
      kind: production
      checksum: 61bf98fe31ea641937b25127bb5b76ed15928107fadc33ea9a5ea0a0838fa2e2
    - path: daemon_test.go
      description: Tests source invalidation, repository boundaries, descriptor security, worker behavior, caching, concurrency, and fallback.
      kind: test
      checksum: 21d2edaa5fbb931f4a1f2e51785df1a08a0dca52888a9b011b1e13738b268a1d
    - path: graph.go
      description: Defines focused graph and symbol-resolution projections with selector-specific keying, querying, and publication.
      kind: production
      checksum: 96521c6eba2b2e4d030d24795a1c2f1a387603a79a55f23bd47c284b337f3cd0
    - path: graph_test.go
