description: Provides an optional authenticated local worker for generating cached architecture reports from validated source selections.
responsibilities:
    - Run a foreground architecture HTTP worker
    - Authenticate and validate local report requests
    - Validate source boundaries and snapshot project context
    - Cache reports for stable source snapshots
    - Publish and validate secure daemon descriptors
    - Query compatible local workers with bounded transport
    - Fall back when workers are unavailable
