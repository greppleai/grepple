description: Shared CLI runtime primitives for command execution, invocation context, repository configuration, output handling, and exit signaling.
responsibilities:
    - Define shared command and argument interfaces
    - Construct configurable CLI invocation contexts
    - Resolve repository identity and working state
    - Load and validate repository configuration
    - Apply repository-wide invocation policies
    - Provide bounded and JSON-formatted output
    - Track intentional command exit statuses
    - Supply injectable runtime service adapters
