description: Implements the GritQL structural search command for bounded local scanning, paginated remote querying, query explanation, deterministic result processing, metadata generation, and runtime integration.
responsibilities:
    - Parse and validate structural search and explanation arguments
    - Load and compile bounded GritQL queries
    - Scan local source files with configurable resource limits
    - Query paginated remote structural search results
    - Explain compiled query features, wrappers, variables, and diagnostics
    - Merge, normalize, sort, and deduplicate structural responses
    - Build result metadata, diagnostics, and continuation commands
    - Provide command dependencies, output services, and exported helpers
    - Test parsing, compilation, scanning, explanation, remote access, paging, merging, and rendering
