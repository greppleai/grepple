description: Implements the context command for invalidating session-agnostic structural-segment context with a normalized reason.
responsibilities:
    - Construct the context command.
    - Display command usage help.
    - Parse invalidation reasons from command arguments.
    - Reject missing reasons and unknown arguments.
    - Execute context invalidation with a default manual reason.
    - Verify reason parsing, persistence, and argument rejection.
