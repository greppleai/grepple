description: The cli package parses, normalizes, dispatches, and validates Grepple commands while applying repository scope, output, environment, and projection policies.
responsibilities:
    - Register and dispatch application commands
    - Parse global options and help requests
    - Normalize default commands and nested modes
    - Enforce local, remote, and source-independent availability
    - Apply repository configuration and production-only scope
    - Spill oversized output into managed artifacts
    - Preserve repository options across continuations
    - Propagate requested command exit statuses
    - Configure navigation cache defaults
    - Validate CLI import and documentation boundaries
    - Compare local and remote analysis projections
    - Verify parity across navigation projections
    - Benchmark agent workflow artifact handling
