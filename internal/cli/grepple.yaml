description: The cli package parses, normalizes, and dispatches Grepple commands while applying repository scope, daemon execution, output spilling, process defaults, exit statuses, and projection consistency.
responsibilities:
    - Register and dispatch application commands
    - Parse global and nested command arguments
    - Normalize implicit commands and legacy modes
    - Route command and topic help
    - Validate command execution universes
    - Apply repository configuration and source-selection scope
    - Coordinate daemon-backed architecture and graph execution
    - Spill oversized output into managed artifacts
    - Preserve invocation options across reruns and continuations
    - Propagate requested command exit statuses
    - Configure navigation cache defaults
    - Document CLI workflows and presentation contracts
    - Enforce CLI import boundaries
    - Compare local and public analysis projections
    - Verify navigation projection parity
    - Benchmark agent workflows and artifact retrieval
