description: The cli package parses, normalizes, validates, and dispatches Grepple commands while managing repository scope, output spilling, process defaults, and projection consistency.
responsibilities:
    - Register and dispatch application commands
    - Parse global and nested command arguments
    - Normalize default command modes and help requests
    - Validate command availability across execution universes
    - Apply repository configuration and source-selection scope
    - Spill oversized output into managed artifacts
    - Preserve invocation options across continuations and reruns
    - Propagate requested command exit statuses
    - Configure navigation cache defaults
    - Document CLI workflows and output contracts
    - Enforce CLI import boundaries
    - Compare local and public analysis projections
    - Verify parity across navigation projections
    - Benchmark agent workflows and artifact retrieval
