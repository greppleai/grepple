description: Implements deterministic CLI commands for building, querying, resolving, diffing, and rendering source navigation graphs.
responsibilities:
    - Dispatch graph build, resolve, diff, and traversal subcommands
    - Build normalized local and exact remote navigation graphs
    - Traverse incoming callers and outgoing callees
    - Select roots by symbols, locations, packages, modules, and paths
    - Filter graph results by languages, confidences, and visibilities
    - Resolve declarations into deterministic matches and follow-up commands
    - Compare semantic declarations and calls with normalized paths
    - Render complete JSON and bounded compact graph output
    - Report source statistics, truncation, diagnostics, and continuation commands
