description: Implements deterministic CLI commands for building, querying, resolving, diffing, and rendering source navigation graphs.
responsibilities:
    - Dispatch graph subcommands and validate arguments
    - Build normalized local and remote navigation graphs
    - Traverse callers, callees, impact, dependencies, and dependents
    - Resolve declarations into deterministic alternatives
    - Compare semantic declarations and calls
    - Render complete JSON and bounded compact output
    - Filter sources, languages, confidences, and visibilities
    - Report source processing, truncation, diagnostics, and continuation metadata
