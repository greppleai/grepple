description: The anchors CLI dispatches provider doctor and setup commands, validates provider executables and protocols, safely manages user settings, and verifies native anchor behavior.
responsibilities:
    - Dispatch doctor and setup subcommands
    - Diagnose provider configuration and protocol round trips
    - Render human-readable and JSON diagnostics
    - Preview and safely persist provider settings
    - Enforce executable, timeout, and replacement validation
    - Verify native hashline generation and defaults
    - Test command routing and provider workflows
