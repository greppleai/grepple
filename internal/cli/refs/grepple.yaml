description: The refs package provides a CLI command for listing, filtering, and rendering repository references indexed by a remote service.
responsibilities:
    - Parse refs command arguments and validate reference kinds
    - Resolve server configuration and retrieve indexed references
    - Filter references by repository and kind
    - Render tabular or deterministic JSON output
    - Signal empty non-JSON results through the command context
    - Capture command output for tests
    - Verify reference listing and filtering behavior
