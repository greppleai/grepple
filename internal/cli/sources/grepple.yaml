description: Implements the sources CLI for explaining repository source-selection decisions, configuration effects, production filtering, and deterministic report output.
responsibilities:
    - Construct repository source-selection dependencies
    - Derive environment, ignore, and production settings
    - Parse and validate explain command arguments
    - Build source-selection reports
    - Render human-readable and JSON reports
    - Format deterministic classification and exclusion counts
    - Test command help and source-selection reporting
