description: Implements the sources CLI for inspecting repository source-selection decisions, applying configuration and production filters, and rendering deterministic reports.
responsibilities:
    - Construct repository source-selection dependencies
    - Derive environment and configuration settings
    - Parse and validate explain command arguments
    - Build source-selection reports
    - Render compact and JSON output
    - Format classification and exclusion counts
    - Verify command help and report behavior
