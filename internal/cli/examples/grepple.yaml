description: Implements the examples command and its catalog of copyable workflows for source orientation, retrieval, editing, impact analysis, boundary triage, auditing, diagramming, and architecture analysis.
responsibilities:
    - Define task-oriented workflow examples and command sequences
    - Select all workflows or a named workflow
    - Render workflow descriptions and commands
    - Display workflow help and supported task names
    - Validate task names and argument counts
    - Enforce unique workflow names and commands
    - Test workflow coverage, filtering, help, and validation
