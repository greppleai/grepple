description: Provides the examples command and its task-oriented Grepple workflow catalog for source orientation, retrieval, editing, impact analysis, boundary triage, auditing, diagramming, and architecture analysis.
responsibilities:
    - Define copyable workflow tasks and command sequences
    - Select all workflows or one named workflow
    - Render workflow descriptions and commands
    - Validate task names and argument counts
    - Display workflow help and supported task names
    - Enforce unique workflow names and commands
    - Test command execution through configurable output writers
