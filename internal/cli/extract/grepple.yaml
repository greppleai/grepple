description: Implements local extract commands that generate and validate source-linked Mermaid structure and call-flow diagrams from supported source code.
responsibilities:
    - Parse structure, flow, and check modes
    - Validate extraction options and entry selectors
    - Resolve entries by symbol or source location
    - Load scoped source files through repository services
    - Generate focused Mermaid structure diagrams
    - Generate focused Mermaid call-flow diagrams
    - Validate diagrams against source
    - Write diagrams to stdout or files
    - Provide recursive command help and diagnostics
