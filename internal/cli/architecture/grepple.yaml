description: Provides CLI commands and public APIs for constructing, querying, rendering, comparing, and summarizing source-linked directory architecture.
responsibilities:
    - Build architecture reports from configured local source paths
    - Resolve source-linked symbols and directory relation evidence
    - Render directory summaries, relation views, and Mermaid diagrams
    - Project bounded directory responsibility reports
    - Compare normalized architecture reports and JSON encodings
    - Execute exact remote repository architecture requests
    - Expose injectable dependencies and public architecture projections
    - Parse architecture subcommands and dispatch execution
    - Generate deterministic Mermaid directory colors
    - Test multilingual analysis, source classification, relations, rendering, comparison, and remote operations
