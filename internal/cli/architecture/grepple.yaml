description: Implements source-linked directory architecture reports, rendering, and CLI integration.
responsibilities:
    - Build deterministic architecture reports from local source paths
    - Query exact indexed repositories for architecture data
    - Resolve source declarations and directory relationships
    - Render inventories, relations, Mermaid diagrams, and bounded text
    - Expose directory command arguments and report APIs
    - Integrate injected source configuration, remote transport, and output handling
    - Generate deterministic high-contrast Mermaid directory colors
    - Test multilingual directory analysis, relations, rendering, remote operations, and command dispatch
