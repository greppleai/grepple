description: Implements source-linked directory architecture analysis, projections, rendering, comparison, and CLI integration.
responsibilities:
    - Build deterministic architecture reports from local source paths
    - Query exact indexed repositories for architecture data
    - Resolve source declarations and directory relationships
    - Render inventories, relations, Mermaid diagrams, and bounded text
    - Project directory responsibilities from architecture reports
    - Normalize and compare architecture JSON reports and encodings
    - Expose architecture command arguments and public APIs
    - Integrate injected source configuration, remote transport, and output handling
    - Generate deterministic high-contrast Mermaid directory colors
    - Test multilingual analysis, relations, rendering, comparison, remote operations, and command dispatch
