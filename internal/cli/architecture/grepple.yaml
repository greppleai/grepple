description: Provides CLI commands and public APIs for building, querying, rendering, comparing, and summarizing source-linked directory architecture.
responsibilities:
    - Build language-neutral architecture reports from local or indexed sources
    - Resolve source-linked declarations and relation evidence
    - Render bounded summaries, compressed relations, and Mermaid diagrams
    - Project directory responsibility reports
    - Compare normalized architecture snapshots and byte encodings
    - Support exact remote repository analysis requests
    - Expose injectable command dependencies and public projections
    - Parse architecture subcommands and execution modes
