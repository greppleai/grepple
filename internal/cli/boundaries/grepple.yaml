description: Implements local and remote boundary analysis for repeated workflows, type representation spread, and policy-defined facade bypasses with cached navigation graphs and bounded reporting.
responsibilities:
    - Parse and validate boundary command options
    - Resolve source paths and build navigation graphs
    - Cache graphs with source, parser, and repository-context invalidation
    - Analyze repeated workflows, type spreads, and facade bypasses
    - Load and validate repository boundary policies
    - Render complete JSON and bounded human-readable reports
    - Attach source diagnostics, truncation details, limits, and continuation commands
files:
    - path: boundaries.go
      description: Defines the boundaries command, executes local or remote workflow and type analysis, and renders complete JSON or bounded human-readable reports.
      kind: production
      checksum: e9384644fbfa46cf3ce41f929f1c75b3674a33cf7f4f00803127940aba0310b7
