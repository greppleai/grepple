description: Implements indexed repository file retrieval with line-range handling and content or structural outline rendering.
responsibilities:
    - Parse repository, path, server, line-range, JSON, outline, kind, and depth options
    - Fetch raw indexed file content from the configured API
    - Render file contents, filtered outlines, and JSON outlines
    - Report range warnings and errors through diagnostics and command exits
    - Record partial and full line-range outcomes in context statistics
    - Test retrieval, range outcomes, context output, outline rendering, and kind filtering
