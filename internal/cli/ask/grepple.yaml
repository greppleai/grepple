description: The ask package implements a read-only AI-assisted repository research command with provider selection, cached typed tools, bounded local and indexed source analysis, parser-backed research universes, evidence-focused prompts, and telemetry.
responsibilities:
    - Parse and execute ask commands
    - Resolve providers, models, preferences, and deadlines
    - Run cached typed research tools
    - Search, navigate, read, and structurally inspect source
    - Analyze architecture and code relationships
    - Query indexed repository references and trees
    - Enforce repository scope and bounded inputs
    - Reuse parser-backed local research universes
    - Generate source-backed read-only prompts
    - Record research logs and telemetry
