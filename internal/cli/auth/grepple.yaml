description: Authentication commands implement GitHub device-flow login, logout, and AI-provider credential operations.
responsibilities:
    - Construct authentication command objects
    - Dispatch login, logout, and AI-provider operations
    - Parse remote and provider authentication arguments
    - Fetch server-provided GitHub login configuration
    - Execute GitHub device-flow authentication
    - Persist and clear authentication tokens
    - Manage AI-provider login, logout, and status
    - Read provider secrets from terminal or piped input
    - Test command dispatch and context output behavior
    - Test device-flow, token storage, and provider integration
