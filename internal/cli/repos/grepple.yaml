description: The repos package provides a CLI command for retrieving, deduplicating, filtering, and displaying repositories indexed by a remote service.
responsibilities:
    - Parse repository listing arguments
    - Resolve configured server defaults
    - Fetch indexed repositories
    - Deduplicate repository names
    - Filter repositories case-insensitively
    - Render line-based or JSON output
    - Signal empty repository results
