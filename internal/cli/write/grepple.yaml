description: Implements a strict, hash-anchored transactional write command supporting JSON, heredoc, and literal edit inputs.
responsibilities:
    - Parse bounded JSON, heredoc, and literal edit requests
    - Validate schemas, paths, anchors, content, operations, and transaction limits
    - Prepare confined edits, creates, and deletes
    - Preserve newline styles and existing permissions
    - Produce dry-run diffs and structured or human-readable responses
    - Commit changes with concurrency checks, atomic installation, and rollback
