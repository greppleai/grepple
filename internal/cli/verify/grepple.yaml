description: Verifies repository-owned directory metadata for selected source paths and reports missing, stale, or invalid entries.
responsibilities:
    - Parse verification paths and JSON output options
    - Discover policy-scoped source files
    - Inspect directory metadata status
    - Build metadata verification reports
    - Emit text or JSON results
    - Request failure exits for metadata problems
