description: Generates validated grepple.yaml metadata for policy-selected source directories using configured language models and confined inspection tools.
responsibilities:
    - Parse initialization arguments
    - Select policy-compliant source files
    - Support exact-directory generation
    - Build prompts from existing metadata and authoritative manifests
    - Generate and validate directory metadata
    - Preserve authoritative paths and checksums
    - Configure language model providers
    - Persist generated metadata
    - Enforce repository and tool path confinement
    - Provide bounded tree, grep, and file-reading tools
