description: Generates and persists validated grepple.yaml metadata for selected source directories using confined inspection tools and configurable language models.
responsibilities:
    - Parse initialization arguments
    - Select policy-compliant source files
    - Plan metadata generation and refreshes
    - Support forced and exact-directory generation
    - Generate metadata with configured language models
    - Validate descriptions and source kinds
    - Preserve authoritative paths and checksums
    - Bound concurrent generation workers
    - Persist directory metadata
    - Enforce repository and tool path confinement
    - Provide bounded tree, grep, and file-reading tools
files:
