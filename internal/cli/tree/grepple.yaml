description: Implements the tree command for depth-limited local and indexed repository source trees with kind filtering and metadata-aware rendering.
responsibilities:
    - Parse and validate tree command options
    - Normalize explicit and legacy repository targets
    - Dispatch local or indexed repository tree requests
    - Build sorted depth-limited local entries
    - Filter local entries by source kind
    - Attach directory and file metadata
    - Render tree responses and manage empty-result exits
    - Test tree routing, kind filtering, and metadata behavior
