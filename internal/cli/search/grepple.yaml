description: Implements the search CLI for parsing options, searching local, piped, and remote sources, rendering results, generating anchors, resolving navigation, and reporting metadata.
responsibilities:
    - Parse and validate search flags, aliases, modes, bounds, paths, and repositories
    - Search local files, explicit paths, piped stdin, and opted-in remote sources
    - Merge, sort, page, limit, exclude, and count search results
    - Render structural, contextual, line-only, compact, JSON, outline, count, and path output
    - Generate source anchors and resolve local and external navigation
    - Report scopes, diagnostics, truncation, limits, omissions, and continuation commands
    - Test parsing, execution, integrations, rendering, navigation, anchors, ranges, and edge cases
