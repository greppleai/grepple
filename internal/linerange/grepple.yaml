description: The linerange package resolves inclusive source-line ranges and normalizes file content into editor-style lines.
responsibilities:
    - Validate positive ascending ranges
    - Clamp ranges at end of file
    - Classify exact, partial, and full misses
    - Report range outcomes and EOF warnings
    - Split content into addressable lines
