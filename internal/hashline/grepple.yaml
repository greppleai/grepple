description: Provides deterministic, file-local three-character anchors for newline-delimited content.
responsibilities:
    - Generate unique anchors for content lines
    - Canonicalize carriage returns and trailing whitespace
    - Validate anchor length and alphabet
    - Encode anchors with xxHash32
