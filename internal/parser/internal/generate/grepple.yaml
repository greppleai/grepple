description: Generates deterministic parser language metadata from Tree-sitter grammar modules.
responsibilities:
    - Inspect configured grammar modules
    - Parse node, field, child, and subtype metadata
    - Compute grammar source fingerprints
    - Expand transitive subtype relationships
    - Render or validate generated Go metadata
