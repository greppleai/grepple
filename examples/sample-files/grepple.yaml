description: Sample files demonstrate reusable UI components, domain models, service configuration, deployment settings, documentation, and operational logs.
responsibilities:
    - Define reusable UI components
    - Model inventory and order domains
    - Configure and deploy the service
    - Document service usage and limits
    - Record operational events
