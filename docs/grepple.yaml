description: Defines Grepple's contracts for parsing, search, navigation, analysis, source selection, output, editing, indexing, benchmarking, and release workflows.
responsibilities:
    - Specify parser ownership, syntax lifecycles, language support, and compatibility.
    - Define deterministic search, structural matching, ranking, navigation, and scope rendering.
    - Document architecture, graph, boundary, ownership, and dependency analysis.
    - Specify bounded output, metadata, artifacts, completeness, and resolution behavior.
    - Describe delegated research, provider safety, benchmarks, and performance budgets.
    - Define anchored transactional editing and deterministic source selection.
    - Record indexing, release, and implementation-boundary workflows.
