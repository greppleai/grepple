description: Defines Grepple's authoritative documentation for parser behavior, language support, search, analysis, output contracts, editing, indexing, benchmarking, and releases.
responsibilities:
    - Define parser ownership, syntax lifecycles, language support, and GritQL compatibility.
    - Specify deterministic search ranking, structural matching, navigation, source scope, and classifications.
    - Document architecture, graph, boundary, ownership, dependency, and responsibility analysis.
    - Specify bounded output, metadata, artifacts, completeness, resolution, and remote indexing.
    - Describe delegated research, provider safety, benchmarks, performance budgets, and release validation.
    - Define anchored transactional editing and source classification workflows.
