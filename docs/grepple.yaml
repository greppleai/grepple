description: Defines Grepple's parser, search, navigation, analysis, source-selection, output, editing, research, indexing, architecture, and release contracts.
responsibilities:
    - Specify parser ownership, syntax access, language support, and lifecycle behavior.
    - Define deterministic search ranking, structural matching, navigation, and scope rendering.
    - Document architecture, graph, boundary, ownership, and dependency analysis.
    - Specify bounded output, metadata, artifacts, completeness, and resolution behavior.
    - Describe delegated research, provider safety, benchmarks, and performance budgets.
    - Define anchored transactional editing and deterministic source selection.
    - Record indexing, compatibility, release, and implementation-boundary workflows.
