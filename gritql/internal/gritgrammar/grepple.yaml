description: Provides a vendored Tree-sitter grammar and Go binding for parsing GritQL source files.
responsibilities:
    - Define GritQL syntax, patterns, expressions, and language declarations
    - Generate Tree-sitter parser artifacts and syntax node metadata
    - Expose the generated grammar through a Go language binding
    - Record vendoring provenance and verified regeneration procedures
    - Provide licensing terms for vendored grammar sources
