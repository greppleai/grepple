description: Provides the Grepple Go code-search engine, parser and navigation infrastructure, structural query system, architecture analysis, CLI, documentation, configuration, testing, and release automation.
responsibilities:
    - Parse supported programming languages
    - Search and filter source repositories
    - Execute bounded structural queries
    - Build navigation and architecture graphs
    - Resolve package dependencies
    - Expose CLI and API contracts
    - Validate schemas and architecture boundaries
    - Document workflows and capabilities
    - Build and release portable binaries
