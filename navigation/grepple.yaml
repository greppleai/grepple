description: The navigation package builds deterministic multilingual repository graphs, resolves local and external relationships, and supports filtering, traversal, diffing, and resolution analysis.
responsibilities:
    - Build deterministic navigation graphs from files, documents, and text sources
    - Resolve declarations, calls, imports, exports, fields, receivers, re-exports, and repository identities
    - Apply language-specific navigation rules for Go, Rust, Python, JavaScript, TypeScript, Java, Kotlin, C#, C, C++, and shell
    - Resolve Go modules, workspaces, packages, replacements, and repository context
    - Qualify external references from manifests, lockfiles, dependency evidence, and artifact responses
    - Filter graphs by language, confidence, and visibility while preserving referential integrity
    - Traverse bounded caller, callee, dependency, dependent, and impact subgraphs
    - Classify semantic declaration and call changes while ignoring position-only shifts
    - Measure aggregate and language-specific resolution outcomes, confidence, ambiguity, and rates
